server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Locations below add their own headers; merge keeps these as well.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Docker DNS, resolved per request so a recreated php container keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: every request goes to Symfony's front controller.
    location /api/ {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;

        # Errors nginx produces itself get the same JSON shape as the API.
        error_page 413 @api_too_large;
        error_page 502 503 504 =503 @api_unavailable;
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Požadavek je příliš velký."}}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"Server je dočasně nedostupný. Zkuste to prosím za chvíli."}}';
    }

    # Vite puts a content hash into asset names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single page app: unknown paths fall back to index.html, the router handles them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
