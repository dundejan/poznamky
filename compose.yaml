name: poznamky

services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: notes
      MARIADB_USER: notes
      MARIADB_PASSWORD: notes
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    # No TLS on the private network; MariaDB's auto-generated certificate made the first init flaky.
    command: ["--skip-ssl"]
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # App user over TCP: passes only once init has finished (the image's healthcheck.sh flaked).
      test: ["CMD-SHELL", "mariadb --skip-ssl -h 127.0.0.1 -u\"$$MARIADB_USER\" -p\"$$MARIADB_PASSWORD\" -e 'SELECT 1' \"$$MARIADB_DATABASE\" > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment:
      DATABASE_URL: mysql://notes:notes@db:3306/notes?serverVersion=12.3.3-MariaDB&charset=utf8mb4
      LOAD_DEMO_DATA: "1"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # FPM accepts connections only after the entrypoint has finished migrations.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/notes"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  db-data:
