name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (coding style, PHPStan, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same stack as `docker compose up` locally, so CI tests what reviewers run.
      - name: Start the stack
        run: docker compose up --detach --build --wait

      - name: Coding style, static analysis and tests
        run: docker compose exec -T php composer check

      - name: Smoke test through nginx
        run: |
          curl --fail --silent http://localhost:8080/api/notes | grep -q '"data"'
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="app">'

      - name: Build the production PHP image
        run: docker build --target prod --file docker/php/Dockerfile .

      - name: Show logs
        if: failure()
        run: docker compose logs

  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build-only
