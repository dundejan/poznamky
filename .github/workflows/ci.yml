name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Stack (CS, PHPStan, tests, smoke test, prod image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same stack reviewers start locally.
      - name: Start the stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Coding style, static analysis and tests
        run: docker compose exec -T php composer check

      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/notes | grep -q '"data"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'

      - name: Build and check the production PHP image
        run: |
          docker build --target prod --tag poznamky-php:prod --file docker/php/Dockerfile .
          docker run --rm -e APP_SECRET=ci poznamky-php:prod bin/console lint:container

      - name: Show container state and logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build-only
